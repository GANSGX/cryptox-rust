<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoX — Статус сервисов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --card: #121214;
      --card-inner: #18181b;
      --border: #222226;
      --text: #fafafa;
      --muted: #a1a1aa;
      --subtle: #71717a;
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.12);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.12);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 36px 20px 64px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* ШАПКА */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--text);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .btn-pill {
      background: var(--text);
      color: var(--bg);
      border: 1px solid var(--text);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .btn-pill:hover {
      opacity: 0.88;
    }

    /* ГЛАВНЫЙ БАННЕР СТАТУСА */
    .status-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .banner-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px var(--green-soft);
      flex-shrink: 0;
    }

    .status-banner.degraded .status-dot {
      background: var(--amber);
      box-shadow: 0 0 0 5px var(--amber-soft);
    }

    .banner-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .banner-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    .banner-time {
      font-size: 12px;
      color: var(--subtle);
    }

    /* КАРТОЧКА СПИСКА СЕРВИСОВ */
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
      padding-left: 4px;
    }

    .services-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .svc-row {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .svc-row:last-child {
      border-bottom: none;
    }

    .svc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }

    .svc-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .svc-desc {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .badge.ok {
      background: var(--green-soft);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .badge.down {
      background: var(--red-soft);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.28);
    }

    /* ШКАЛА АПТАЙМА */
    .uptime-bars {
      display: grid;
      grid-template-columns: repeat(60, 1fr);
      gap: 3px;
      height: 24px;
    }

    .bar {
      border-radius: 3px;
      background: var(--green);
      opacity: 0.85;
      transition: opacity 0.15s ease;
    }

    .bar:hover {
      opacity: 1;
    }

    .bar.down {
      background: var(--red);
      opacity: 1;
    }

    .svc-footer {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--subtle);
      margin-top: 8px;
    }

    /* ИСТОРИЯ СОБЫТИЙ */
    .events-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 22px;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .event-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      padding: 10px 14px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      gap: 12px;
    }

    .event-time {
      font-size: 12px;
      color: var(--subtle);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ВЕРХНЯЯ ШАПКА -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">CX</div>
        <div class="brand-title">CryptoX — Статус сервисов</div>
      </div>
      <a href="/" class="btn-pill">Открыть мессенджер</a>
    </header>

    <!-- ГЛАВНЫЙ СТАТУС -->
    <section class="status-banner" id="statusBanner">
      <div class="banner-left">
        <div class="status-dot"></div>
        <div>
          <div class="banner-title" id="bannerTitle">Все сервисы работают стабильно</div>
          <div class="banner-sub" id="bannerSub">Проблем в работе мессенджера и серверов не зафиксировано</div>
        </div>
      </div>
      <div class="banner-time" id="lastUpdated">Обновлено: только что</div>
    </section>

    <!-- СПИСОК СЕРВИСОВ -->
    <div class="section-label">Текущее состояние компонентов</div>
    <section class="services-card" id="servicesList"></section>

    <!-- ЖУРНАЛ СОБЫТИЙ -->
    <div class="section-label">Последние события</div>
    <section class="events-card">
      <div class="event-list" id="eventList"></div>
    </section>
  </div>

  <script>
    const TICKS = 60;
    const histories = {};
    const prevStates = {};

    const SERVICE_NAMES_RU = {
      "edge-gateway": {
        title: "Шлюз подключений",
        desc: "Прием соединений и живой обмен данными (WebSocket)"
      },
      "messaging-svc": {
        title: "Личные сообщения и чаты",
        desc: "Отправка, получение и синхронизация истории переписки"
      },
      "cryptox-storage": {
        title: "База данных",
        desc: "Зашифрованное хранение сообщений и профилей на диске"
      },
      "auth-vault-svc": {
        title: "Авторизация и аккаунты",
        desc: "Вход в систему, регистрация и подключение новых устройств"
      },
      "user-directory-svc": {
        title: "Поиск сотрудников",
        desc: "Поиск коллег в адресной книге компании по @username"
      },
      "presence-receipts-svc": {
        title: "Статусы и уведомления",
        desc: "Отображение статуса «в сети» и галочек прочтения сообщений"
      }
    };

    function addEvent(text) {
      const list = document.getElementById("eventList");
      const time = new Date().toLocaleTimeString("ru-RU", { hour12: false });
      const row = document.createElement("div");
      row.className = "event-row";
      row.innerHTML = `<span>${text}</span><span class="event-time">${time}</span>`;
      list.prepend(row);
      while (list.children.length > 8) {
        list.removeChild(list.lastChild);
      }
    }

    async function loadStatus() {
      try {
        const res = await fetch("/api/status/overview");
        if (!res.ok) return;
        const data = await res.json();
        render(data);
      } catch (e) {
        console.error(e);
      }
    }

    function render(data) {
      const timeStr = new Date().toLocaleTimeString("ru-RU", { hour12: false });
      document.getElementById("lastUpdated").textContent = "Обновлено в " + timeStr;

      const banner = document.getElementById("statusBanner");
      const title = document.getElementById("bannerTitle");
      const sub = document.getElementById("bannerSub");

      if (data.overall_status === "OPERATIONAL") {
        banner.className = "status-banner";
        title.textContent = "Все сервисы работают стабильно";
        sub.textContent = "Проблем в работе мессенджера и серверов не зафиксировано";
      } else {
        banner.className = "status-banner degraded";
        title.textContent = "Частичный сбой отдельных сервисов";
        sub.textContent = "Личные чаты и отправка сообщений продолжают работать без ограничений";
      }

      const container = document.getElementById("servicesList");
      container.innerHTML = "";

      for (const svc of data.services) {
        const info = SERVICE_NAMES_RU[svc.id] || { title: svc.name, desc: svc.description };

        if (!histories[svc.id]) {
          histories[svc.id] = Array(TICKS).fill(true);
        }
        const hist = histories[svc.id];
        hist.push(svc.operational);
        if (hist.length > TICKS) hist.shift();

        if (prevStates[svc.id] !== undefined && prevStates[svc.id] !== svc.operational) {
          if (!svc.operational) {
            addEvent(`Сервис «${info.title}» временно недоступен`);
          } else {
            addEvent(`Работа сервиса «${info.title}» полностью восстановлена`);
          }
        }
        prevStates[svc.id] = svc.operational;

        const upCount = hist.filter(Boolean).length;
        const pct = ((upCount / hist.length) * 100).toFixed(0);

        const barsHtml = hist
          .map((up) => `<div class="bar ${up ? "" : "down"}" title="${up ? "Работает" : "Сбой"}"></div>`)
          .join("");

        const row = document.createElement("div");
        row.className = "svc-row";
        row.innerHTML = `
          <div class="svc-header">
            <div>
              <div class="svc-name">${info.title}</div>
              <div class="svc-desc">${info.desc}</div>
            </div>
            <span class="badge ${svc.operational ? "ok" : "down"}">
              ${svc.operational ? "● Работает" : "● Недоступен"}
            </span>
          </div>
          <div class="uptime-bars">${barsHtml}</div>
          <div class="svc-footer">
            <span>Последние проверки</span>
            <span>Доступность: ${pct}%</span>
            <span>Сейчас</span>
          </div>
        `;
        container.appendChild(row);
      }
    }

    addEvent("Все системы проверены — сервисы работают в штатном режиме");
    loadStatus();
    setInterval(loadStatus, 2000);
  </script>
</body>
</html>
